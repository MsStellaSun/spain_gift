<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🇪🇸 西班牙像素之旅</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --spain-red: #AA151B;
            --spain-yellow: #F1BF00;
            --ocean-blue: #0067A5;
            --pixel-bg: #FFEFD5;
            --text-color: #2c2c2c;
            --border-color: #4a4a4a;
            --shadow-color: rgba(0,0,0,0.2);
            
            /* 地图颜色调色板 */
            --map-water: #4B9CD3;
            --map-land: #E5D5B5;
            --map-grass: #7C9A6B;
            --map-road: #C0A080;
            --map-dark: #8B4513;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'VT323', 'DotGothic16', monospace, sans-serif;
            background-color: var(--ocean-blue);
            overflow: hidden;
        }

        #app {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle, transparent 20%, var(--ocean-blue) 20%, var(--ocean-blue) 80%, transparent 80%, transparent),
                radial-gradient(circle, transparent 20%, var(--ocean-blue) 20%, var(--ocean-blue) 80%, transparent 80%, transparent);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        .header {
            height: 60px;
            background: var(--spain-red);
            border-bottom: 4px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 4px 0 var(--shadow-color);
        }

        .header h1 {
            color: #fff;
            font-size: 24px;
            margin: 0;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 1px;
            font-family: 'VT323', 'DotGothic16', monospace;
            font-weight: normal;
        }

        #back-btn {
            position: absolute;
            left: 10px;
            background: #fff;
            border: 2px solid #000;
            padding: 5px 10px;
            font-family: 'VT323', 'DotGothic16', monospace;
            font-size: 18px;
            cursor: pointer;
            display: none;
            box-shadow: 2px 2px 0 #000;
        }

        #back-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* --- 地图区域 --- */
        #map-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: var(--map-water); /* 默认底色 */
            margin: 10px;
            border: 4px solid var(--border-color);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            border-radius: 4px;
            /* 允许设置背景图片 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 背景地图 Canvas */
        #map-bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            image-rendering: pixelated; /* 像素风核心 */
            opacity: 1; 
        }

        .map-layer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.5s ease;
            z-index: 1; /* 确保图标在 Canvas 之上 */
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        .marker {
            position: absolute;
            transform: translate(-50%, -100%);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            
            /* 增大点击热区 */
            padding: 15px;        /* 增加透明内边距，扩大触摸面积 */
            margin-bottom: -15px; /* 修正因 padding 导致的视觉偏移 */
            
            /* 消除移动端点击高亮背景块 */
            -webkit-tap-highlight-color: transparent;
        }

        .marker-icon {
            font-size: 32px;
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.3));
            transition: transform 0.2s;
            
            /* 浮动动画 */
            animation: float 2s infinite ease-in-out;
        }

        .marker.locked .marker-icon {
            filter: grayscale(100%) drop-shadow(2px 2px 0 rgba(0,0,0,0.2));
            opacity: 0.7;
        }

        .marker-label {
            background: #fff;
            border: 2px solid #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 14px;
            margin-top: 2px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            white-space: nowrap;
            font-family: 'VT323', 'DotGothic16', monospace;
            position: relative;
            z-index: 2;
        }

        .marker:active .marker-icon {
            transform: scale(0.9);
            animation-play-state: paused;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); } 
        }

        #toast {
            position: fixed;
            top: 15%;
            left: 50%;
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border: 2px solid #fff;
            border-radius: 4px;
            font-size: 16px;
            z-index: 100;
            box-shadow: 4px 4px 0 #000;
            display: none;
            text-align: center;
            width: auto;
            max-width: 80%;
            pointer-events: none;
        }

        @keyframes toastFadeIn {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
            padding: 20px; /* 增加外边距防止贴边 */
        }

        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 500px;
            border: 4px solid #000;
            padding: 0;
            position: relative;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            /* 修改：提升至 92vh，极限利用屏幕高度 */
            max-height: 92vh; 
        }

        .modal-header {
            background: var(--spain-yellow);
            padding: 10px;
            border-bottom: 4px solid #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .modal-title {
            font-weight: normal;
            font-size: 22px;
            color: #000;
            font-family: 'VT323', 'DotGothic16', monospace;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
        }

        .close-btn {
            background: var(--spain-red);
            color: #fff;
            border: 2px solid #000;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 2px 2px 0 #000;
        }

        .modal-body {
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            /* 允许滚动 */
            overflow-y: auto; 
            flex: 1;
            
            /* 隐藏滚动条 */
            scrollbar-width: none; 
            -ms-overflow-style: none; 
        }
        .modal-body::-webkit-scrollbar {
            display: none;
        }

        /* 图片包裹容器 */
        .img-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 150px;
            margin-bottom: 10px; 
            background: transparent;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        /* 加载状态类 */
        .img-wrapper.loading {
            border: 2px solid #000;
            background-color: #eee;
            background-image: linear-gradient(
                45deg, #eee 25%, #ddd 25%, #ddd 50%, #eee 50%, #eee 75%, #ddd 75%, #ddd 100%
            );
            background-size: 20px 20px;
            animation: pixel-loading 1s linear infinite;
        }

        /* 图片本身样式优化 */
        .modal-img {
            display: block;
            max-width: 100%;
            /* 修改：提升至 70vh，让竖图显示更完整 */
            max-height: 70vh; 
            width: auto;
            height: auto;
            object-fit: contain;
            
            border: 2px solid #000;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2); 
            
            opacity: 0; 
            transition: opacity 0.3s ease;
        }

        @keyframes pixel-loading {
            0% { background-position: 0 0; }
            100% { background-position: 20px 0; }
        }

        .modal-text {
            font-size: 16px;
            line-height: 1.3;
            color: #333;
            flex-shrink: 0;
            margin: 0;
            padding-top: 5px;
            font-family: 'DotGothic16', monospace; 
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 60;
            /* 修复1: 默认隐藏 Canvas，物理杜绝遮挡点击 */
            display: none; 
        }

        .footer-deco {
            height: 20px;
            background: repeating-linear-gradient(
                45deg,
                var(--spain-red),
                var(--spain-red) 10px,
                var(--spain-yellow) 10px,
                var(--spain-yellow) 20px
            );
            border-top: 4px solid #000;
        }
    </style>
</head>
<body>

    <div id="app">
        <header class="header">
            <button id="back-btn">◀ BACK</button>
            <h1>SPAIN TRIP 🇪🇸</h1>
        </header>

        <div id="map-container">
            <canvas id="map-bg-canvas" width="128" height="128"></canvas>

            <!-- 国家层：西班牙全图 -->
            <div id="country-view" class="map-layer">
                <div style="position:absolute; top:10px; right:10px; font-size:14px; opacity:0.8; background: rgba(255,255,255,0.7); padding: 2px 5px; border-radius: 4px;">MAP: SPAIN</div>
            </div>

            <!-- 城市层：具体城市地图 -->
            <div id="city-view" class="map-layer hidden">
                <div id="city-name-display" style="position:absolute; top:10px; right:10px; font-size:14px; opacity:0.8; background: rgba(255,255,255,0.7); padding: 2px 5px; border-radius: 4px;"></div>
            </div>
        </div>

        <div class="footer-deco"></div>
    </div>

    <div id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modal-title-text">Location Unlocked!</span>
                <div class="close-btn" onclick="closeModal()">×</div>
            </div>
            <div class="modal-body">
                <!-- 修改了ID以防冲突 -->
                <div class="img-wrapper" id="spain-modal-img-wrapper">
                    <img src="" alt="Scenery" class="modal-img" id="spain-modal-image">
                </div>
                <p class="modal-text" id="modal-message"></p>
            </div>
        </div>
    </div>

    <div id="toast">Message here</div>
    <canvas id="confetti-canvas"></canvas>

    <script>
        const GAME_DATA = {
            madrid: {
                id: 'madrid',
                name: 'Madrid',
                icon: '🏰',
                // 修改：向下平移 y: 45 -> 58，x 微调至 48
                x: 48, y: 58, 
                landmarks: [
                    {
                        id: 'sol',
                        name: 'Puerta del Sol',
                        icon: '🐻', 
                        x: 50, y: 50,
                        unlockDate: "2023-10-01T00:00:00", 
                        image: "https://s2.imgbb.ws/file/storage-sv2/XGAYO.jpg", 
                        message: "生日快乐！就像马德里的中心，你也是我心中的C位！愿你永远闪闪发光✨"
                    },
                    {
                        id: 'prado',
                        name: 'Prado Museum',
                        icon: '🎨',
                        x: 70, y: 60,
                        unlockDate: "2025-12-20T09:00:00", 
                        image: "https://images.unsplash.com/photo-1558642452-9d2a7deb7f62",
                        message: "这幅画叫《最好的闺蜜》，是非卖品哦！🎨"
                    }
                ]
            },
            sevilla: {
                id: 'sevilla',
                name: 'Sevilla',
                icon: '💃',
                // 修改：向下平移 y: 75 -> 86，x 微调至 32
                x: 32, y: 86,
                landmarks: [
                    {
                        id: 'plaza',
                        name: 'Plaza de España',
                        icon: '⛲',
                        x: 50, y: 50,
                        unlockDate: "2023-01-01T00:00:00",
                        image: "https://images.unsplash.com/photo-1559313162-0758436df85d?q=80&w=800",
                        message: "塞维利亚的阳光都不如你灿烂！愿你的每一天都像弗拉明戈一样热情似火！💃"
                    }
                ]
            },
            barcelona: {
                id: 'barcelona',
                name: 'Barcelona',
                icon: '🦎',
                // 修改：向下平移 y: 30 -> 42，x 微调至 82
                x: 82, y: 42,
                landmarks: [
                    {
                        id: 'sagrada',
                        name: 'Sagrada Família',
                        icon: '⛪',
                        x: 40, y: 40,
                        unlockDate: "2023-01-01T00:00:00",
                        image: "https://images.unsplash.com/photo-1583779457094-0068806775fb?q=80&w=800",
                        message: "高迪的曲线属于上帝，但我们的友谊直线连接！生日快乐！🎂"
                    },
                    {
                        id: 'beach',
                        name: 'Barceloneta Beach',
                        icon: '🏖️',
                        x: 70, y: 70,
                        unlockDate: "2025-05-20T00:00:00", 
                        image: "https://images.unsplash.com/photo-1512766572373-2c01d4b76999",
                        message: "海风和啤酒都准备好啦！🍻"
                    }
                ]
            }
        };

        let currentView = 'country'; 
        let currentCityId = null;

        const countryViewEl = document.getElementById('country-view');
        const cityViewEl = document.getElementById('city-view');
        const backBtn = document.getElementById('back-btn');
        const modalOverlay = document.getElementById('modal-overlay');
        const toastEl = document.getElementById('toast');
        const cityNameDisplay = document.getElementById('city-name-display');
        
        const bgCanvas = document.getElementById('map-bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');

        function init() {
            drawMapBackground('country');
            renderCountryMap();
            
            backBtn.addEventListener('click', () => {
                if (currentView === 'city') {
                    switchView('country');
                }
            });
        }

        function drawMapBackground(type) {
            const w = bgCanvas.width;
            const h = bgCanvas.height;
            const mapContainer = document.getElementById('map-container');
            
            // 1. 统一清空 Canvas
            // 因为现在所有视图都使用精美的背景图片，不再需要 Canvas 绘制的粗糙像素地形了
            bgCtx.clearRect(0, 0, w, h);
            
            // 2. 根据类型设置背景图片 URL
            let bgUrl = '';
            
            if (type === 'country') {
                bgUrl = "https://s1.imgbb.ws/file/storage-sv1/XAtIX.jpg";
            } else if (type === 'madrid') {
                bgUrl = "https://s1.imgbb.ws/file/storage-sv1/XAtiK.jpg";
            } else if (type === 'sevilla') {
                bgUrl = "https://s1.imgbb.ws/file/storage-sv1/XA01t.jpg";
            } else if (type === 'barcelona') {
                bgUrl = "https://s1.imgbb.ws/file/storage-sv1/XA0QZ.jpg";
            }

            // 3. 应用背景
            if (bgUrl) {
                mapContainer.style.backgroundImage = `url('${bgUrl}')`;
            } else {
                mapContainer.style.backgroundImage = 'none';
            }
        }

        // 下面的辅助绘图函数 (addNoise, drawMadridGeo 等) 虽然保留在代码中，
        // 但因为 drawMapBackground 不再调用它们，所以不会执行。
        // 这样如果以后你想换回 Canvas 绘制也很方便。

        function addNoise(ctx, width, height, density, color) {
            ctx.fillStyle = color;
            for(let i=0; i < (width * height * density); i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                ctx.fillRect(Math.floor(x), Math.floor(y), 1, 1);
            }
        }

        // drawSpainGeo 函数暂时保留但未被调用，以防万一你想改回去

        function drawMadridGeo(w, h) {
            bgCtx.fillStyle = '#E0C8A0'; 
            bgCtx.fillRect(0, 0, w, h);

            bgCtx.fillStyle = '#D0B890'; 
            bgCtx.beginPath();
            bgCtx.arc(w/2, h/2, 30, 0, Math.PI*2);
            bgCtx.fill();

            bgCtx.fillStyle = '#C0A070';
            bgCtx.beginPath();
            bgCtx.arc(w/2, h/2, 10, 0, Math.PI*2);
            bgCtx.fill();

            bgCtx.strokeStyle = '#70A0C0';
            bgCtx.lineWidth = 2;
            bgCtx.beginPath();
            bgCtx.moveTo(w/2 - 10, 0);
            bgCtx.quadraticCurveTo(w/2 - 20, h/2, w/2 - 10, h);
            bgCtx.stroke();

            bgCtx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            bgCtx.lineWidth = 1;
            bgCtx.beginPath();
            bgCtx.arc(w/2, h/2, 20, 0, Math.PI*2);
            bgCtx.stroke();

            addNoise(bgCtx, w, h, 0.1, 'rgba(160, 82, 45, 0.1)');
        }

        function drawSevillaGeo(w, h) {
            bgCtx.fillStyle = '#D8E6C0'; 
            bgCtx.fillRect(0, 0, w, h);

            bgCtx.fillStyle = '#4B9CD3';
            bgCtx.beginPath();
            bgCtx.moveTo(40, 0);
            bgCtx.bezierCurveTo(60, 40, 20, 80, 30, 128);
            bgCtx.lineTo(45, 128); 
            bgCtx.bezierCurveTo(35, 80, 75, 40, 55, 0);
            bgCtx.fill();

            bgCtx.fillStyle = '#E0C090';
            bgCtx.beginPath();
            bgCtx.ellipse(60, 60, 15, 25, 0.2, 0, Math.PI*2);
            bgCtx.fill();

            bgCtx.fillStyle = 'rgba(100, 128, 0, 0.05)';
            for(let y=0; y<h; y+=16) {
                bgCtx.fillRect(0, y, w, 1);
            }
        }

        function drawBarcelonaGeo(w, h) {
            bgCtx.fillStyle = '#4B9CD3';
            bgCtx.fillRect(0, 0, w, h);

            bgCtx.fillStyle = '#E0D0B0';
            bgCtx.beginPath();
            bgCtx.moveTo(0, 0);
            bgCtx.lineTo(w, 0);
            bgCtx.lineTo(0, h);
            bgCtx.fill();

            bgCtx.strokeStyle = '#F0E090'; 
            bgCtx.lineWidth = 3;
            bgCtx.beginPath();
            bgCtx.moveTo(w, 0);
            bgCtx.lineTo(0, h);
            bgCtx.stroke();

            bgCtx.fillStyle = '#D0A080'; 
            bgCtx.beginPath();
            bgCtx.moveTo(10, 10);
            bgCtx.lineTo(w-20, 10);
            bgCtx.lineTo(10, h-20);
            bgCtx.fill();

            bgCtx.fillStyle = 'rgba(139, 0, 0, 0.1)';
            for(let x=10; x<w; x+=4) {
                for(let y=10; y<h; y+=4) {
                    if(x + y < w - 10) { 
                        bgCtx.fillRect(x, y, 1, 1);
                    }
                }
            }

            bgCtx.fillStyle = '#8B9B70';
            bgCtx.beginPath();
            bgCtx.moveTo(0, 0);
            bgCtx.lineTo(60, 0);
            bgCtx.lineTo(0, 60);
            bgCtx.fill();
        }

        function renderCountryMap() {
            countryViewEl.innerHTML = '<div style="position:absolute; top:10px; right:10px; font-size:14px; opacity:0.8; background: rgba(255,255,255,0.7); padding: 2px 5px; border-radius: 4px;">MAP: SPAIN</div>';
            Object.values(GAME_DATA).forEach(city => {
                const marker = createMarker(city.x, city.y, city.icon, city.name, false);
                marker.onclick = () => enterCity(city.id);
                countryViewEl.appendChild(marker);
            });
        }

        function renderCityMap(cityId) {
            const cityData = GAME_DATA[cityId];
            currentCityId = cityId;
            cityViewEl.innerHTML = '';
            cityNameDisplay.innerText = `CITY: ${cityData.name.toUpperCase()}`;
            cityViewEl.appendChild(cityNameDisplay);

            cityData.landmarks.forEach(landmark => {
                const isLocked = checkIsLocked(landmark.unlockDate);
                const marker = createMarker(landmark.x, landmark.y, landmark.icon, landmark.name, isLocked);
                marker.onclick = () => handleLandmarkClick(landmark);
                cityViewEl.appendChild(marker);
            });
        }

        function createMarker(x, y, icon, label, isLocked) {
            const el = document.createElement('div');
            el.className = `marker ${isLocked ? 'locked' : ''}`;
            el.style.left = `${x}%`;
            el.style.top = `${y}%`;
            el.style.animationDelay = `${Math.random() * 2}s`;

            el.innerHTML = `
                <div class="marker-icon">${icon}</div>
                <div class="marker-label">${label}${isLocked ? ' 🔒' : ''}</div>
            `;
            return el;
        }

        function switchView(viewName) {
            if (viewName === 'city') {
                countryViewEl.classList.add('hidden');
                cityViewEl.classList.remove('hidden');
                backBtn.style.display = 'block';
                currentView = 'city';
                drawMapBackground(currentCityId);
            } else {
                cityViewEl.classList.add('hidden');
                countryViewEl.classList.remove('hidden');
                backBtn.style.display = 'none';
                currentView = 'country';
                drawMapBackground('country');
            }
        }

        function enterCity(cityId) {
            currentCityId = cityId; 
            renderCityMap(cityId);
            switchView('city');
        }

        function handleLandmarkClick(landmark) {
            const isLocked = checkIsLocked(landmark.unlockDate);
            if (isLocked) {
                const dateObj = new Date(landmark.unlockDate);
                const dateStr = `${dateObj.getMonth() + 1}月${dateObj.getDate()}日`;
                showToast(`⏳ 还没有到时间哦！<br>请等到 ${dateStr} 再来解锁！`);
            } else {
                showModal(landmark);
                fireConfetti();
            }
        }

        function checkIsLocked(unlockDateStr) {
            const now = new Date();
            const unlockTime = new Date(unlockDateStr);
            return now < unlockTime;
        }

        let toastTimeout;
        function showToast(msg) {
            toastEl.innerHTML = msg;
            toastEl.style.display = 'block';
            toastEl.style.animation = 'toastFadeIn 0.3s ease-out forwards';
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.style.display = 'none';
            }, 1500);
        }

        function showModal(landmark) {
            // 使用更具体的ID获取元素，并添加了容错
            const titleEl = document.getElementById('modal-title-text');
            const wrapper = document.getElementById('spain-modal-img-wrapper');
            // 注意：不再需要获取 imgEl，因为我们将在下面动态创建它
            const msgEl = document.getElementById('modal-message');

            if (titleEl) titleEl.innerText = landmark.name;
            if (msgEl) msgEl.innerText = landmark.message;

            if (wrapper) {
                // 1. 关键修复：每次打开前彻底清空容器
                // 这样可以清除之前的错误提示文字，或者旧的图片状态
                wrapper.innerHTML = ''; 
                
                // 2. 动态创建一个全新的图片元素
                const newImg = document.createElement('img');
                newImg.id = 'spain-modal-image';
                newImg.className = 'modal-img';
                newImg.alt = 'Scenery';
                
                // 初始状态：透明（为了做淡入效果）
                newImg.style.opacity = '0';
                
                // 将新图片添加到容器中
                wrapper.appendChild(newImg);
                
                // 3. 设置加载中状态（背景动画 + 边框）
                wrapper.classList.add('loading'); 
                wrapper.style.border = '2px solid #000'; 
                
                // 4. 绑定事件
                newImg.onload = function() {
                    wrapper.classList.remove('loading');
                    wrapper.style.border = 'none'; 
                    this.style.opacity = '1';
                };
                
                newImg.onerror = function() {
                    wrapper.classList.remove('loading');
                    // 如果出错，用文字替换图片（这会导致图片元素消失，但没关系，
                    // 因为下次打开时我们会执行 wrapper.innerHTML = '' 重置回来）
                    wrapper.innerHTML = '<span style="font-family:\'VT323\', monospace; font-size: 16px;">Image not found :(</span>';
                    wrapper.style.border = '2px solid #000';
                };
                
                // 5. 设置图片源（最后设置，触发加载）
                newImg.src = landmark.image;
                
            } else {
                console.warn("Modal wrapper not found.");
            }
            
            const modalOverlay = document.getElementById('modal-overlay');
            if(modalOverlay) modalOverlay.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confetti = [];
        // 修复2: 增加动画状态标志位
        let isConfettiAnimating = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function fireConfetti() {
            // 每次发射时，先确保 Canvas 是显示的
            canvas.style.display = 'block';

            // 生成 100 个碎片
            for (let i = 0; i < 100; i++) {
                confetti.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20 - 5,
                    grav: 0.5
                });
            }

            // 修复3: 只有当动画未运行时，才启动循环
            // 如果已经在运行，上面的 push 已经把新粒子加进去了，现有的循环会自动处理
            if (!isConfettiAnimating) {
                isConfettiAnimating = true;
                animateConfetti();
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 倒序遍历，方便删除
            for (let i = confetti.length - 1; i >= 0; i--) {
                let c = confetti[i];
                c.x += c.vx;
                c.y += c.vy;
                c.vy += c.grav;
                c.vx *= 0.95;
                
                ctx.fillStyle = c.color;
                ctx.fillRect(c.x, c.y, c.w, c.h);
                
                if (c.y > canvas.height) {
                    confetti.splice(i, 1);
                }
            }

            if (confetti.length > 0) {
                requestAnimationFrame(animateConfetti);
            } else {
                // 修复4: 动画结束时，重置状态并隐藏 Canvas
                isConfettiAnimating = false;
                canvas.style.display = 'none'; // 隐藏画布，把点击权还给地图
                // 清空画布以防万一
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        init();
    </script>
</body>
</html>
